services:
  - type: web
    name: uniconnect-portal
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build && npm run postinstall && npm run db:push && npm run db:seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: "file:./dev.db"

